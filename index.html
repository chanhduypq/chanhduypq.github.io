<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Bản demo tĩnh của Ứng dụng Toán học">
  <title>Ứng dụng Toán học</title>
  <link rel="stylesheet" href="./assets/katex/katex.min.css">
  <link rel="stylesheet" href="./assets/demo.css">
</head>
<body>
  <a class="skip-link" href="#main-content">Đến nội dung chính</a>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#/" aria-label="Ứng dụng Toán học - Trang chủ">
        <span class="brand-mark" aria-hidden="true">∑</span>
        <span>Ứng dụng Toán học</span>
      </a>
      <button class="nav-toggle" type="button" data-action="toggle-nav" aria-expanded="false" aria-controls="main-nav">Danh mục</button>
      <nav class="main-nav" id="main-nav" aria-label="Danh mục chính">
        <a href="#/" data-nav="home">Trang chủ</a>
        <a href="#/study" data-nav="study">Học tập</a>
        <a href="#/practice" data-nav="practice">Luyện tập</a>
        <a href="#/exams" data-nav="exams">Luyện thi</a>
        <a href="#/history" data-nav="history">Lịch sử</a>
        <a href="#/symbols" data-nav="symbols">Ký hiệu</a>
        <button type="button" data-action="open-feedback">Góp ý</button>
      </nav>
    </div>
  </header>

  <main id="main-content" tabindex="-1">
    <div id="app">
      <div class="loading-state">Đang tải dữ liệu bản demo…</div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="site-footer-inner">
      <span>Ứng dụng Toán học · Bản demo tĩnh</span>
      <button class="text-button" type="button" data-action="open-feedback">Góp ý</button>
    </div>
  </footer>

  <div class="modal-backdrop" id="feedback-backdrop" hidden>
    <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="feedback-title">
      <div class="modal-heading">
        <div>
          <span class="eyebrow">Ứng dụng Toán học</span>
          <h2 id="feedback-title">Góp ý</h2>
        </div>
        <button class="icon-button" type="button" data-action="close-feedback" aria-label="Đóng hộp thoại">×</button>
      </div>
      <p class="muted">Gửi góp ý của bạn để Công Tuệ có thể phản hồi trong ứng dụng.</p>
      <form id="feedback-form">
        <label for="feedback-content">Nội dung góp ý</label>
        <textarea id="feedback-content" rows="6" placeholder="Nhập nội dung góp ý…"></textarea>
        <div class="modal-actions">
          <button class="button button-secondary" type="button" data-action="close-feedback">Đóng</button>
          <button class="button button-primary" type="submit">Gửi</button>
        </div>
      </form>
    </section>
  </div>

  <div class="modal-backdrop" id="install-backdrop" hidden>
    <section class="modal-card modal-card-compact" role="dialog" aria-modal="true" aria-labelledby="install-title">
      <div class="modal-heading">
        <h2 id="install-title">Nộp bài</h2>
        <button class="icon-button" type="button" data-action="close-install" aria-label="Đóng thông báo">×</button>
      </div>
      <p id="install-message" class="install-message" aria-live="polite"></p>
      <div class="modal-actions modal-actions-end">
        <button class="button button-primary" type="button" data-action="close-install">Đã hiểu</button>
      </div>
    </section>
  </div>

  <div class="modal-backdrop" id="solution-backdrop" hidden>
    <section class="modal-card modal-card-wide" role="dialog" aria-modal="true" aria-labelledby="solution-title">
      <div class="modal-heading">
        <h2 id="solution-title">Lời giải</h2>
        <button class="icon-button" type="button" data-action="close-solution" aria-label="Đóng lời giải">×</button>
      </div>
      <div id="solution-content" class="rich-content"></div>
      <div class="modal-actions modal-actions-end">
        <button class="button button-secondary" type="button" data-action="close-solution">Đóng</button>
      </div>
    </section>
  </div>

  <script src="./assets/katex/katex.min.js"></script>
  <script src="./assets/demo.js"></script>
</body>
</html>
